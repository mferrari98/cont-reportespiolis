services:
  app:
    image: cont-reportespiolis
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reportespiolis
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /mnt/compartido:/mnt/compartido:ro
      - reportes_db:/app/src/basedatos
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  reportes_db:
