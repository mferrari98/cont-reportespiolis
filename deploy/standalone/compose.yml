name: reportespiolis-standalone

services:
  reportespiolis:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: reportespiolis-standalone:5dff1fb
    container_name: cont-reportespiolis-standalone
    ports:
      - "${REPORTESPIOLIS_HOST_PORT:-3001}:3000"
    volumes:
      - /mnt/compartido:/mnt/compartido:ro
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - ./.env
    environment:
      DB_PATH: /app/data/database.sqlite
      PORT: "3000"
      TRUST_PROXY: "true"
    command: ["npm", "start"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
