services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reportespiolis-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /mnt/compartido:/mnt/compartido:ro
      - reportes_db:/app/src/basedatos
    networks:
      - reportes_net

  nginx:
    image: nginx:1.27-alpine
    container_name: reportespiolis-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - reportes_net

volumes:
  reportes_db:

networks:
  reportes_net:
    driver: bridge
